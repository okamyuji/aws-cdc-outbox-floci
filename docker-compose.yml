# ローカルAWSエミュレータ floci
# RDS(実MySQLコンテナ)とLambda(実Dockerコンテナ)を使うため、Dockerソケットをマウントする
# 7000-7099はRDSプロキシポート帯。ホストからは localhost:<プロキシポート> でMySQLに接続する
services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
      # macOSのAirPlayが7000番を使うため7001始まりにする
      - "7001-7099:7001-7099"
    environment:
      # LambdaコンテナからもホストからもflociのURLを解決できるホスト名にする
      - FLOCI_HOSTNAME=host.docker.internal
      - FLOCI_SERVICES_RDS_PROXY_BASE_PORT=7001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
