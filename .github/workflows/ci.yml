name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小権限。全ジョブ(reusable呼び出し含む)へ継承される。
# gitleaksはSARIFアップロードをせずartifact化のみのためcontents: readで足りる
permissions:
  contents: read

jobs:
  go-ci:
    uses: okamyuji/reusable-workflows/.github/workflows/go-ci.yml@main
    with:
      working-directory: golang
      test-command: "go test ./... -coverprofile=coverage.out -covermode=atomic"

  security-scan:
    uses: okamyuji/reusable-workflows/.github/workflows/security-scan.yml@main

  lint-and-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: golang/go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: golang
      - name: staticcheck
        working-directory: golang
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        working-directory: golang
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  rails-ci:
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@main
    with:
      working-directory: rails/source_api
      with-mysql: true

  rails-ci-target:
    uses: okamyuji/reusable-workflows/.github/workflows/rails-ci.yml@main
    with:
      working-directory: rails/target_api
      with-mysql: true

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: fmt check
        run: terraform fmt -check -recursive terraform/
      - name: validate local
        working-directory: terraform/envs/local
        run: terraform init -backend=false -input=false && terraform validate
      - name: validate stg
        working-directory: terraform/envs/stg
        run: terraform init -backend=false -input=false && terraform validate
